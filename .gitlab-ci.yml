# GitLab CI/CD — build and deploy the ESPD-EDM Reference Implementation as a static site to GitLab Pages.
#
# The site is static-only (served from the Pages root). The two server-dependent
# features (TED lookup, ITB validation) are disabled at build time by
# scripts/build-pages.js, which sets window.__ESPD_SERVERLESS__ = true in the
# deployed copy of js/runtime-config.js.

stages:
  - deploy

pages:
  stage: deploy
  image: node:20-alpine
  script:
    - npm run build:pages
  artifacts:
    paths:
      - public
  rules:
    # Deploy only from the default branch.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
