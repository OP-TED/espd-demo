<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESPD Service — European Single Procurement Document</title>
  <meta name="description" content="Create and manage European Single Procurement Documents (ESPD) for public procurement procedures.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="/css/espd.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header class="container-fluid espd-header">
    <nav aria-label="Main navigation">
      <ul>
        <li><strong>ESPD Service</strong></li>
      </ul>
      <ul>
        <li>
          <select id="language-select" aria-label="Language">
            <option value="en" selected>English</option>
          </select>
        </li>
      </ul>
    </nav>
  </header>

  <main id="main-content" class="container">
    <!-- Landing / Home Page (content rendered dynamically by home.js) -->
    <section id="landing-page" aria-labelledby="landing-heading">
      <h1 id="landing-heading" class="visually-hidden">European Single Procurement Document (ESPD)</h1>
    </section>

    <!-- Wizard Container (hidden until role selected) -->
    <section id="wizard-container" hidden aria-labelledby="wizard-heading">
      <h2 id="wizard-heading" class="visually-hidden">ESPD Form Wizard</h2>

      <!-- Combined wizard navigation: context + step progress -->
      <div class="espd-wizard-nav-bar">
        <div class="espd-wizard-header"></div>
        <nav id="wizard-nav" aria-label="Form steps">
          <ol class="espd-steps" role="list">
            <!-- Populated dynamically -->
          </ol>
        </nav>
      </div>

      <!-- Form Content Area -->
      <form id="espd-form" novalidate>
        <div id="form-content" role="region" aria-live="polite" aria-label="Current form section">
          <!-- Rendered dynamically by renderer.js -->
        </div>

        <!-- Navigation Buttons -->
        <footer class="espd-form-footer">
          <div class="espd-form-actions-left">
            <button type="button" id="btn-prev" class="secondary outline" disabled>← Previous</button>
          </div>
          <div class="espd-form-actions-right">
            <button type="button" id="btn-overview" class="secondary">Overview</button>
            <button type="button" id="btn-next">Next →</button>
            <button type="button" id="btn-download" class="contrast" hidden>Download XML</button>
            <button type="button" id="btn-validate" class="secondary" hidden aria-label="Validate XML against ESPD rules">Validate XML</button>
          </div>
        </footer>
      </form>
    </section>

    <!-- Overview Modal -->
    <dialog id="overview-dialog">
      <article>
        <header>
          <button aria-label="Close" rel="prev" id="btn-close-overview"></button>
          <h3>ESPD Overview</h3>
        </header>
        <div id="overview-content">
          <!-- Populated dynamically -->
        </div>
        <footer>
          <button id="btn-close-overview-footer" class="secondary">Close</button>
          <button id="btn-download-overview" class="contrast">Download XML</button>
        </footer>
      </article>
    </dialog>

    <!-- Validation Result Dialog -->
    <dialog id="validation-dialog" aria-labelledby="validation-dialog-heading">
      <article>
        <header>
          <button aria-label="Close" rel="prev" id="btn-close-validation"></button>
          <h3 id="validation-dialog-heading">Validation Result</h3>
        </header>
        <div id="validation-content">
          <!-- Populated dynamically -->
        </div>
        <footer>
          <button id="btn-close-validation-footer" class="secondary">Close</button>
        </footer>
      </article>
    </dialog>

    <!-- Confirmation Dialog for New ESPD -->
    <dialog id="confirm-new-dialog">
      <article>
        <header>
          <h3>Start New ESPD?</h3>
        </header>
        <p>You have unsaved work in your current session. Starting a new ESPD will discard all progress.</p>
        <footer>
          <button id="btn-confirm-new-cancel" class="secondary">Cancel</button>
          <button id="btn-confirm-new-ok" class="contrast">Discard &amp; Continue</button>
        </footer>
      </article>
    </dialog>
  </main>

  <footer class="container-fluid espd-footer">
    <small>
      <a href="https://docs.ted.europa.eu/ESPD-EDM/latest/" target="_blank" rel="noopener">Documentation</a>
    </small>
  </footer>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
